<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cardápio temporariamente indisponível</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            background: #f8f6f2;
            color: #310505;
            font-family: Arial, sans-serif;
            text-align: center;
        }

        main {
            width: 100%;
            max-width: 420px;
            padding: 40px 24px;
            background: #ffffff;
            border-radius: 16px;
            box-shadow: 0 8px 30px rgba(0, 0, 0, 0.06);
        }

        .icone {
            font-size: 48px;
            margin-bottom: 20px;
        }

        h1 {
            margin: 0 0 16px;
            font-size: 25px;
        }

        p {
            margin: 0;
            color: #666666;
            font-size: 16px;
            line-height: 1.7;
        }

        .marca {
            margin-top: 32px;
            color: #999999;
            font-size: 12px;
        }
    </style>
</head>

<body>
    <main>
        <div class="icone">🍽️</div>

        <h1>Cardápio temporariamente indisponível</h1>

        <p>
            Este cardápio não está disponível no momento.
            Por favor, entre em contato com o responsável.
        </p>

        <div class="marca">
            Cardápio digital
        </div>
    </main>
</body>

</html>
