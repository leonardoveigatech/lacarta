<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/login.css') }}" />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@500;600&family=Cormorant:wght@400;500&family=Montserrat:wght@300;400;500&display=swap"
        rel="stylesheet">

    <title>Login - La Carta</title>
</head>

<body>

    <h1>Login <br>administrativo</h1>

    <p>Área exclusiva dos estabelecimentos.</p>

    <form method="POST">

        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div>
            <label for="email">E-mail</label>
            <input type="email" id="email" name="email" required>
        </div>

        <br>

        <div>
            <label for="senha">Senha</label>
            <input type="password" id="senha" name="senha" required>
        </div>

        <br>

        <button type="submit">Entrar</button>

    </form>
    <a href="{{ url_for('admin.esqueci_senha') }}">
        Esqueci minha senha
    </a>
    <a href="{{ url_for('public.inicio') }}" class="sobre-cta-button">

        Voltar para o início

    </a>
</body>

</html>
