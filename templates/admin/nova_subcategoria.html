{% extends "admin/base.html" %}

{% block title %}
Nova Subcategoria | La Carta
{% endblock %}

{% block content %}

<section class="secao">

    <div class="topo pequeno">

        <div>

            <div class="detalhes">
                <span>{{ categoria.nome }}</span>
            </div>

            <h3>
                Nova subcategoria
            </h3>

            <p>
                Crie uma nova subcategoria para organizar os produtos.
            </p>

        </div>

    </div>

    <form method="POST" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="campo">

            <label for="nome">
                Nome da subcategoria
            </label>

            <input type="text" id="nome" name="nome" placeholder="Ex.: Hambúrgueres" required>

        </div>

        <div class="campo">

            <label for="ordem">
                Ordem de exibição
            </label>

            <input type="number" id="ordem" name="ordem" value="0" min="0">

        </div>

        <div class="campo">

            <label class="campo-checkbox">

                <input type="checkbox" name="ativo" value="1" checked>

                Subcategoria ativa

            </label>

        </div>

        <div class="acoes">

            <a href="{{ url_for(
                    'admin.subcategorias',
                    categoria_id=categoria.id
                ) }}" class="botao secundario">
                Cancelar
            </a>

            <button type="submit" class="botao">
                Criar subcategoria
            </button>

        </div>

    </form>

</section>

{% endblock %}
