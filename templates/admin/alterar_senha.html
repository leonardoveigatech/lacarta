{% extends "admin/base.html" %}

{% block title %}Alterar senha | La Carta{% endblock %}

{% block content %}
<section class="secao">
    <div class="topo">
        <div>
            <span class="label">SEGURANÇA</span>
            <h1>Alterar senha</h1>
            <p>Use pelo menos 8 caracteres.</p>
        </div>
    </div>

    <form method="POST" class="form">
        <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

        <div class="campo">
            <label for="senha_atual">Senha atual</label>
            <input type="password" id="senha_atual" name="senha_atual" autocomplete="current-password" required>
        </div>

        <div class="campo">
            <label for="nova_senha">Nova senha</label>
            <input type="password" id="nova_senha" name="nova_senha" minlength="8" autocomplete="new-password" required>
        </div>

        <div class="campo">
            <label for="confirmar_senha">Confirme a nova senha</label>
            <input type="password" id="confirmar_senha" name="confirmar_senha" minlength="8" autocomplete="new-password" required>
        </div>

        <div class="acoes"><button type="submit" class="botao">Salvar nova senha</button></div>
    </form>
</section>
{% endblock %}
